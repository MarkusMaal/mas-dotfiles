# Application bindings
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" tmux new
$terminal = uwsm-app -- xdg-terminal-exec
$browser = omarchy-launch-browser

bindd = SUPER, RETURN, Terminal, exec, $terminal --working-directory="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, dolphin --new-window
bindd = SUPER SHIFT, B, Browser, exec, $browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, $browser --private
bindd = SUPER SHIFT, N, Editor, exec, $terminal -e fresh
bindd = SUPER SHIFT, T, Activity, exec, $terminal -e btop
bindd = SUPER SHIFT, W, Typora, exec, uwsm-app -- typora --enable-wayland-ime
bindd = SUPER SHIFT, P, Passwords, exec, uwsm-app -- keepassxc
bindd = SUPER SHIFT, Q, AnyRun menu, exec, uwsm-app -- anyrun
bindd = WIN CTRL, F, Fake Fullscreen, fullscreen, 1
#bindd = WIN CTRL, B, Remove bars, hyprbars:no_bar, on
bindd = SUPER CTRL, 0, Disable TrueSplit, exec, ddcutil setvcp xF7 0 --noverify && sleep 1 && omarchy theme bg set ~/.mas/bg_desktop.png && cp ~/.mas/bg_login_default.png ~/.mas/bg_login.png && sleep 3 && eww close desktop; eww close logo; eww open logo; eww open desktop
bindd = SUPER CTRL, 1, Enable TrueSplit (50:50 mode), exec, ddcutil setvcp xF7 1 --noverify && sleep 1 && omarchy theme bg set ~/.mas/bg_singlemon.png && cp ~/.mas/bg_login_singlemon.png ~/.mas/bg_login.png && sleep 5 &&eww close desktop; eww close logo; eww open logo; eww open desktop
bindd = SUPER CTRL, 2, Enable TrueSplit (75:25 mode), exec, ddcutil setvcp xF7 2 --noverify && sleep 1 && omarchy theme bg set ~/.mas/bg_singlemon.png && cp ~/.mas/bg_login_singlemon.png ~/.mas/bg_login.png && sleep 5 && eww close desktop; eww close logo; eww open logo; eww open desktop

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
# Uncomment if you're on a Redhat KVM virtual machine
#bindd = SUPER SHIFT, A, Attach USB device from host, exec, ~/.masv/AttachUsbFromHost
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"


bindd = SUPER, M, Log out, exit
bindd = ,XF86PowerOff, Power off, exec, shutdown now
bindn = , mouse:274, exec, wl-copy -pc

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu
