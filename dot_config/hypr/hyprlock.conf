source = ~/.config/omarchy/current/theme/hyprlock.conf
 
general {
    ignore_empty_input = true
}

background {
    monitor =
    color = $color
    path = ~/.mas/bg_login.png
    blur_passes = 0
}

label {
    text = markuse arvuti asjad
    position = 84, 97
    valign = bottom
    font_family = Segoe UI Semilight
    font_size = 24
    color = rgba(255, 255, 255, 0.8)
    shadow_passes = 3
    shadow_boost = 0.9
}

image {
    path = ~/.mas/mas_incons/mas_general.png
    valign = bottom
    border_size = 0 
    size = 128
    position = -163,50
    shadow_passes = 3
    shadow_boost = 0.2
}

animations {
    bezier = overshoot, 0.05, 0.9, 0.1, 1.1
    animation = inputFieldDots, 0
    enabled = true
}

input-field {
    monitor =
    size = 500, 80
    position = 0, 0
    halign = center
    valign = center

    inner_color = $inner_color
    outer_color = $outer_color
    outline_thickness = 0

    font_family = Segoe UI Semilight
    font_color = $font_color

    placeholder_text = Sisesta salasõna
    check_color = $check_color
    fail_text = Vale parool (katseid: $ATTEMPTS)

    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}

auth {
    fingerprint:enabled = true
}
